name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "$(ls *.zip | head -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: derdiedas_app
        run: |
          flutter create --org com.deutschemania --project-name derdiedas --platforms android .
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: DerDieDas-apk
          path: derdiedas_app/build/app/outputs/flutter-apk/app-release.apk
